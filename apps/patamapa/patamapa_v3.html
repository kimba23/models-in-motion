<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>patamapa</title>
<!--
  patamapa.html, v3 — drop videos, pictures and words on it, throw them around, make a (pataphysical) map.
  v2 brought the words; v3 brings the pulse: the pictures push the words around them on a rhythm.

  1. Put this file anywhere and open it (Chrome or Edge).
  2. Drop videos or pictures on it (or a whole folder). They land on the canvas.
     Words: "+ text / texto", or paste text (Ctrl+V), or drop a .txt file.
  3. Drag anything to move it, drag its corner to make it bigger or smaller.
     Videos: double-click the name to rename, ♪ sound on/off, × remove.
     Words: double-click to write, A− A+ size,
            ◯ pour the words into a circle (¶ back to a paragraph),
            ⁘ scatter the paragraph into loose words.
     Words flow around the pictures they touch. A word (or a few) dropped right onto a picture
     sits on it, like a label.
  4. "pulse / pulso": on a beat the pictures push the words around them away, then let them settle.
     A rhythm (tresillo, son clave, fib...) at the bpm you set, or "loop / bucle": each video
     kicks its words when it starts over. The space bar kicks by hand, any time.
  5. "save / guardar" saves the map as patamapa.html IN THE FOLDER OF THE VIDEOS.
     Open that one and the map is there (the words are kept inside the file).

  The words are laid out with Pretext (github.com/chenglou/pretext, MIT, by Cheng Lou and contributors),
  bundled inside this file, so it keeps working offline.
-->
<style>
  :root { --bg: #0a0a0a; --ink: #e6e1d8; --dim: #77726b; --line: #2a2826; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 Georgia, serif; overflow-x: hidden; overflow-y: auto; }
  #stage { position: relative; width: 100%; min-height: 100vh; }
  #stage.over { outline: 2px dashed var(--dim); outline-offset: -12px; }
  #hint { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 6px; color: var(--dim); pointer-events: none; text-align: center; }
  #hint b { font-size: 28px; font-weight: normal; color: var(--ink); letter-spacing: .04em; }
  #bar { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 100000; opacity: .35; transition: opacity .3s; }
  #bar:hover, body.editing #bar { opacity: 1; }
  #bar button, #bar label { font: inherit; font-size: 13px; background: rgba(0,0,0,.6); color: var(--ink); border: 1px solid var(--dim);
          padding: 5px 12px; cursor: pointer; }
  #bar button:hover, #bar label:hover { border-color: var(--ink); }
  #bar select, #bar input { font: inherit; font-size: 13px; background: #000; color: var(--ink); border: 1px solid var(--line); margin-left: 4px; }
  #bar input { width: 52px; }
  #bar.beat label:has(#pulse) { border-color: var(--ink); }
  #msg { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: var(--ink); background: rgba(0,0,0,.7);
         padding: 6px 14px; border: 1px solid var(--line); opacity: 0; transition: opacity .4s; pointer-events: none; z-index: 100001; }
  #msg.on { opacity: 1; }

  .tile { position: absolute; touch-action: none; cursor: grab; user-select: none;
          transition: left .9s cubic-bezier(.2,.9,.25,1.15), top .9s cubic-bezier(.2,.9,.25,1.15), transform .9s cubic-bezier(.2,.9,.25,1.15); }
  .tile.held { cursor: grabbing; transition: none; }
  .tile.fresh { transform: scale(.15) rotate(var(--spin, 0deg)); }
  .tile video, .tile img { display: block; width: 100%; height: auto; background: #000; pointer-events: none; user-select: none; }
  .tile .name { position: absolute; left: 0; bottom: 0; padding: 3px 7px; font-size: 12px; letter-spacing: .06em;
                background: rgba(0,0,0,.55); color: #fff; outline: none; cursor: text; max-width: 100%; }
  .tile .name:empty { display: none; }
  .tile .tools { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; opacity: 0; transition: opacity .2s; z-index: 3; }
  .tile:hover .tools { opacity: 1; }
  .tile .tools button { font: 12px/1 Georgia, serif; min-width: 24px; height: 24px; padding: 0 4px; background: rgba(0,0,0,.65);
                        color: #fff; border: 1px solid rgba(255,255,255,.35); cursor: pointer; }
  .tile .tools button.on { background: #e6e1d8; color: #000; }
  .tile .grip { position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; cursor: nwse-resize; opacity: 0;
                border-right: 2px solid #fff; border-bottom: 2px solid #fff; transition: opacity .2s; z-index: 3; }
  .tile:hover .grip, .tile.held .grip { opacity: .8; }
  .tile.missing video, .tile.missing img { min-height: 80px; outline: 1px dashed var(--dim); }

  /* words: each line is placed by Pretext */
  .words .lines { position: relative; pointer-events: none; }
  .words .ln { position: absolute; white-space: pre; color: var(--ink); text-shadow: 0 0 3px #000, 0 0 1px #000; }
  .words.circle .ln { text-align: center; }
  .words:hover { outline: 1px dashed rgba(255,255,255,.18); }
  .words.circle:hover { outline: none; }
  .words.circle:hover .lines { outline: 1px dashed rgba(255,255,255,.18); border-radius: 50%; }
  .words .tools { top: -28px; right: 0; }
  .words textarea { position: absolute; left: 0; top: 0; width: 100%; min-height: max(100%, 7em); z-index: 2; resize: none;
                    background: rgba(0,0,0,.8); color: var(--ink); border: 1px dashed var(--dim); padding: 0; outline: none; }
  .words.editing .lines { visibility: hidden; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint"><b>patamapa</b><span>drop videos, pictures or text here / suelta videos, fotos o texto aquí</span>
  <span>(or a whole folder, or paste words / o una carpeta entera, o pega palabras)</span></div>
<div id="bar">
  <label>+ add / añadir<input id="pick" type="file" accept="video/*,image/*,.txt,.md,text/plain" multiple hidden></label>
  <button id="addtext">+ text / texto</button>
  <label title="the pictures push the words on this rhythm / las imágenes empujan las palabras con este ritmo">pulse / pulso
    <select id="pulse"></select></label>
  <label title="beats per minute / pulsos por minuto"><input id="bpm" type="number" value="96" min="20" max="300" step="1"> bpm</label>
  <button id="sound">sound / sonido</button>
  <button id="save">save / guardar</button>
</div>
<div id="msg"></div>

<script>
// the saved maps keep their tiles here (guardar writes this line); units are vw, so the map scales with the window
let LAYOUT = null; // @layout

const SOURCE = "<!doctype html>\n" + document.documentElement.outerHTML;   // this page as it was opened: guardar copies it
const stage = document.getElementById("stage"), hint = document.getElementById("hint");
let folder = null;            // when a folder is dropped (Chrome/Edge), guardar writes patamapa.html straight into it
let zTop = 1, soundOn = false, lastX = innerWidth / 2, lastY = innerHeight / 2;

const W = () => window.innerWidth || document.documentElement.clientWidth || 1280;
const vw = px => px / W() * 100;
function say(text) { const m = document.getElementById("msg"); m.textContent = text; m.classList.add("on");
                     clearTimeout(say.t); say.t = setTimeout(() => m.classList.remove("on"), 3500); }
function tiles() { return [...stage.querySelectorAll(".tile")]; }
function refreshHint() { hint.style.display = tiles().length ? "none" : "flex"; }
addEventListener("pointermove", e => { lastX = e.clientX; lastY = e.clientY; });

// ---- a tile: a video or a picture -----------------------------------------------------
function makeTile({ file, src, name, x, y, w, z, sound }) {
  const t = document.createElement("div");
  t.className = "tile";
  t.dataset.file = file;
  t.dataset.sound = sound ? "1" : "0";
  place(t, x, y, w, z);
  const still = isImage({ name: file, type: "" });                   // a picture: an <img>, no sound
  const v = document.createElement(still ? "img" : "video");
  if (still) Object.assign(v, { src, alt: name, draggable: false });
  else Object.assign(v, { src, loop: true, muted: true, playsInline: true, autoplay: true, preload: "auto" });
  v.onerror = () => { t.classList.add("missing"); };
  const label = document.createElement("div");
  label.className = "name"; label.textContent = name; label.spellcheck = false;
  label.ondblclick = e => { e.stopPropagation(); label.contentEditable = "true"; label.focus(); document.execCommand("selectAll"); };
  label.onblur = () => { label.contentEditable = "false"; };
  label.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); label.blur(); } };
  const snd = button("♪", "sound / sonido", () => { const on = t.dataset.sound !== "1"; t.dataset.sound = on ? "1" : "0";
                       snd.classList.toggle("on", on); v.muted = !(on && soundOn); });
  snd.classList.toggle("on", !!sound);
  const tools = document.createElement("div"); tools.className = "tools";
  if (!still) tools.append(snd);
  tools.append(button("×", "remove / quitar", () => { t.remove(); refreshHint(); }));
  const grip = document.createElement("div"); grip.className = "grip";
  t.append(v, label, tools, grip);
  stage.append(t);
  drag(t, grip);
  refreshHint();
  return t;
}

function place(t, x, y, w, z) {
  Object.assign(t.style, { left: x + "vw", top: y + "vw", width: w + "vw", zIndex: z || ++zTop });
  zTop = Math.max(zTop, z || 0);
}
function button(text, title, fn) {
  const b = document.createElement("button"); b.textContent = text; b.title = title;
  b.onclick = e => { e.stopPropagation(); fn(); };
  return b;
}

// ---- a tile of words --------------------------------------------------------------------
// t.dataset.text = the words, .size = letter size in vw, .mode = "flow" (a paragraph) or "circle"
function makeText({ text, x, y, w, z, size, mode }) {
  const t = document.createElement("div");
  t.className = "tile words";
  t.dataset.text = text; t.dataset.size = size || 1.6; t.dataset.mode = mode || "flow"; t.dataset.v = 0;
  place(t, x, y, w, z);
  const lines = document.createElement("div"); lines.className = "lines";
  const shape = button("◯", "circle / círculo", () => {
    t.dataset.mode = t.dataset.mode === "circle" ? "flow" : "circle"; changed(t); });
  const tools = document.createElement("div"); tools.className = "tools";
  tools.append(
    button("A−", "smaller / más pequeño", () => { t.dataset.size = Math.max(.5, t.dataset.size / 1.15).toFixed(3); changed(t); }),
    button("A+", "bigger / más grande", () => { t.dataset.size = (t.dataset.size * 1.15).toFixed(3); changed(t); }),
    shape,
    button("⁘", "scatter / dispersar", () => scatter(t)),
    button("×", "remove / quitar", () => { t.remove(); refreshHint(); }));
  const grip = document.createElement("div"); grip.className = "grip";
  t.append(lines, tools, grip);
  t.ondblclick = e => { if (!e.target.closest(".tools")) write(t); };
  stage.append(t);
  drag(t, grip);
  changed(t);
  refreshHint();
  return t;
}
function changed(t) {
  t.dataset.v = +t.dataset.v + 1;
  t.classList.toggle("circle", t.dataset.mode === "circle");
  const b = t.querySelector('.tools button[title^="circle"], .tools button[title^="paragraph"]');
  if (b) { const c = t.dataset.mode === "circle"; b.textContent = c ? "¶" : "◯"; b.title = c ? "paragraph / párrafo" : "circle / círculo"; }
  wordsLater();
}

// double-click: write in it
function write(t) {
  if (t.querySelector("textarea")) return;
  const ta = document.createElement("textarea");
  ta.value = t.dataset.text; ta.spellcheck = false;
  const px = t.dataset.size * W() / 100;
  ta.style.font = `${px}px/1.3 Georgia, serif`;
  t.classList.add("editing"); document.body.classList.add("editing");
  t.append(ta); ta.focus();
  ta.onpointerdown = e => e.stopPropagation();
  ta.onkeydown = e => { e.stopPropagation(); if (e.key === "Escape") ta.blur(); };
  ta.onblur = () => {
    const v = ta.value; ta.remove(); t.classList.remove("editing"); document.body.classList.remove("editing");
    if (!v.trim()) { t.remove(); refreshHint(); return; }
    t.dataset.text = v; changed(t);
  };
}

// a new tile of words where you are
function addText(text, cx, cy, open, w = 26) {
  const t = makeText({ text, x: Math.min(100 - w, Math.max(0, vw(cx) - w / 2)), y: Math.max(0, vw(cy + scrollY) - 2), w });
  if (open) write(t);
  return t;
}

// ⁘ scatter: the paragraph breaks into loose words, thrown from where it was
function scatter(t) {
  const words = t.dataset.text.split(/\s+/).filter(Boolean);
  if (words.length < 2) return say("one word already / ya es una palabra");
  const size = +t.dataset.size, px = size * W() / 100;
  const ctx = scatter.ctx || (scatter.ctx = document.createElement("canvas").getContext("2d"));
  ctx.font = font(px);
  const cx = t.offsetLeft + t.offsetWidth / 2, cy = t.offsetTop + Math.min(t.offsetHeight, W() * .2) / 2;
  t.remove();
  words.forEach((word, i) => {
    const w = vw(ctx.measureText(word).width * 1.08 + 6);
    const n = makeText({ text: word, x: vw(cx) - w / 2, y: vw(cy), w, size });
    n.style.setProperty("--spin", (Math.random() * 90 - 45) + "deg");
    n.classList.add("fresh");
    const a = i * 2.4, r = size * 2.4 * Math.sqrt(i + .6);                 // a loose spiral, like the videos
    const x = vw(cx) - w / 2 + Math.cos(a) * r * 1.6 + (Math.random() - .5) * size * 2;
    const y = vw(cy) + Math.sin(a) * r * .8 + (Math.random() - .5) * size;
    setTimeout(() => { n.classList.remove("fresh");
      n.style.left = Math.min(100 - w, Math.max(0, x)) + "vw"; n.style.top = Math.max(0, y) + "vw"; }, 30 + i * 25);
  });
  say(`${words.length} words / palabras`);
}

// ---- laying out the words (Pretext) -------------------------------------------------------
const LH = 1.3, START = { segmentIndex: 0, graphemeIndex: 0 };
const font = px => `${px}px Georgia, serif`;
const prepared = new Map();
function prep(text, f) {
  const k = f + "|" + text;
  if (!prepared.has(k)) { if (prepared.size > 600) prepared.clear(); prepared.set(k, Pretext.prepareWithSegments(text, f)); }
  return prepared.get(k);
}
const box = t => ({ x: t.offsetLeft, y: t.offsetTop, w: t.offsetWidth, h: t.offsetHeight });

// ¶ a paragraph: each line takes the free stretches between the pictures lying ON TOP of it
function flow(t, text, px) {
  const lh = Math.round(px * LH), r = box(t), gap = Math.round(px * .7), minw = Math.min(px * 2.5, r.w), z = +t.style.zIndex;
  // words flow around every picture they touch, except one they were dropped right onto (on top, centre inside): a label
  const cx = r.x + r.w / 2, cy = r.y + Math.min(r.h, px * 3) / 2;
  const label = o => z > +o.style.zIndex && cx > o.offsetLeft && cx < o.offsetLeft + o.offsetWidth
                     && cy > o.offsetTop && cy < o.offsetTop + o.offsetHeight;
  const over = tiles().filter(o => o !== t && !o.classList.contains("words") && !label(o))
                      .map(o => { const b = box(o); b.g = gap + (o.kick || 0) * px * JOLT; return b; })   // on a beat the gap jumps
                      .filter(o => o.x < r.x + r.w + o.g && o.x + o.w + o.g > r.x);
  const p = prep(text, font(px)), out = [];
  let cursor = START, rows = 1;
  for (let row = 0; row < 3000; row++) {
    const y0 = r.y + row * lh, y1 = y0 + lh;
    const cuts = over.filter(o => o.y - o.g < y1 && o.y + o.h + o.g > y0)
                     .map(o => [o.x - o.g - r.x, o.x + o.w + o.g - r.x]).sort((a, b) => a[0] - b[0]);
    const spans = [];
    let x = 0;
    for (const [a, b] of cuts) { if (a - x >= minw) spans.push([x, a]); x = Math.max(x, b); }
    if (r.w - x >= minw) spans.push([x, r.w]);
    for (const [a, b] of spans) {
      const line = Pretext.layoutNextLine(p, b - a, cursor);
      if (!line) return { lines: out, h: rows * lh };
      out.push({ text: line.text, x: a, y: row * lh, w: b - a });
      cursor = line.end; rows = row + 1;
    }
  }
  return { lines: out, h: rows * lh };
}

// ◯ a circle as wide as the tile: the biggest letters that still fit (Pretext measures without drawing, so we can try many sizes)
function circle(text, D) {
  const key = D + "|" + text;
  if (circle.memo?.key === key) return circle.memo.res;
  const tryAt = px => {
    const lh = px * LH, rr = D / 2, n = Math.floor(D / lh), p = prep(text, font(px)), out = [];
    let cursor = START;
    for (let i = 0; i < n; i++) {
      const dy = (i + .5) * lh - rr, w = 2 * Math.sqrt(Math.max(0, rr * rr - dy * dy)) * .94;
      if (w < px * 1.5) continue;
      const line = Pretext.layoutNextLine(p, w, cursor);
      if (!line) return { lines: out, px };
      out.push({ text: line.text.trimEnd(), x: (D - w) / 2, y: i * lh + (D - n * lh) / 2, w });
      cursor = line.end;
    }
    return Pretext.layoutNextLine(p, 1e6, cursor) ? null : { lines: out, px };
  };
  let lo = 3, hi = Math.max(4, D / 2), best = null;
  for (let k = 0; k < 16; k++) { const px = (lo + hi) / 2, res = tryAt(px); if (res) { best = res; lo = px; } else hi = px; }
  const res = best || tryAt(3) || { lines: [], px: 3 };
  circle.memo = { key, res };
  return res;
}

function layWords() {
  for (const t of tiles()) {
    if (!t.classList.contains("words")) continue;
    const text = t.dataset.text, lines = t.querySelector(".lines");
    let res, px, h;
    if (t.dataset.mode === "circle") { const D = t.offsetWidth; res = circle(text, D); px = res.px; h = D; }
    else { px = t.dataset.size * W() / 100; res = flow(t, text, px); h = res.h; }
    const lh = px * LH;
    lines.style.height = h + "px";
    lines.replaceChildren(...res.lines.map(l => {
      const d = document.createElement("div"); d.className = "ln"; d.textContent = l.text;
      d.style.cssText = `left:${l.x}px;top:${l.y}px;width:${l.w}px;font:${font(px)};line-height:${lh}px`;
      return d;
    }));
  }
}

// lay the words again whenever anything moved, grew, changed or came to the front
let lastSig = "";
function signature() {
  return W() + "/" + tiles().map(t => t.classList.contains("words")
    ? `${t.offsetLeft},${t.offsetTop},${t.offsetWidth},${t.style.zIndex},w${t.dataset.v}`
    : `${t.offsetLeft},${t.offsetTop},${t.offsetWidth},${t.offsetHeight},${t.style.zIndex}`).join("|");
}
function wordsNow() { const s = signature(); if (s !== lastSig) { lastSig = s; layWords(); } }
function wordsLater() { lastSig = ""; requestAnimationFrame(wordsNow); }
function tick() { pulse(); wordsNow(); requestAnimationFrame(tick); }   // started at the very end

// ---- PULSE / PULSO: the pictures push the words on a beat -------------------------------------
// The clock counts sixteenths at the bpm. A rhythm is a row of steps, x = a hit (the same names as the
// kit's patterns.py). On a hit every picture's gap jumps (JOLT letters wide) and settles back (×0.8 a frame).
const JOLT = 3;
const RHYTHMS = {
  tresillo: "x..x..x.", cinquillo: "x.xx.xx.", habanera: "x..xx.x.", "son clave": "x..x..x...x.x...",
  "rumba clave": "x..x...x..x.x...", bossa: "x..x..x...x..x..", shiko: "x...x.x...x.x...", gahu: "x..x..x...x...x.",
  "four on the floor": "x...x...x...x...", backbeat: "....x.......x...",
};
const LONG = 64;                                                      // fib curves run over four bars
const fib = n => { const o = []; for (let a = 1, b = 2; a < n; [a, b] = [b, a + b]) o.push(a); return o; };
const CURVES = { fib: fib(LONG), "fib backwards / al revés": fib(LONG).map(p => LONG - 1 - p) };
const pulseSel = document.getElementById("pulse"), bpmBox = document.getElementById("bpm");
pulseSel.innerHTML = ["off", "loop / bucle", ...Object.keys(RHYTHMS), ...Object.keys(CURVES)]
  .map(n => `<option>${n}</option>`).join("");
pulseSel.value = "tresillo";                                          // v3 is the pulse: it starts beating
pulseSel.onchange = bpmBox.onchange = () => pulseSel.blur();

function isHit(name, step) {
  if (RHYTHMS[name]) { const s = RHYTHMS[name]; return s[step % s.length] === "x"; }
  if (CURVES[name]) return CURVES[name].includes(step % LONG);
  return false;
}
function kick(t) { t.kick = 1; }
function kickAll() {
  tiles().forEach(t => { if (!t.classList.contains("words")) kick(t); });
  const bar = document.getElementById("bar"); bar.classList.add("beat"); setTimeout(() => bar.classList.remove("beat"), 90);
}

let lastStep = -1;
function pulse() {
  const mode = pulseSel.value;
  if (mode === "loop / bucle") {                                      // a video starting over kicks its own words
    for (const t of tiles()) {
      const v = t.querySelector("video"); if (!v) continue;
      if (t.lastTime != null && v.currentTime < t.lastTime - .2) kick(t);
      t.lastTime = v.currentTime;
    }
  } else if (mode !== "off") {
    const bpm = Math.min(300, Math.max(20, +bpmBox.value || 96));
    const step = Math.floor(performance.now() / 1000 * bpm / 60 * 4);  // sixteenths
    if (step !== lastStep) { if (lastStep >= 0 && isHit(mode, step)) kickAll(); lastStep = step; }
  }
  let moving = false;                                                  // the jolt settles
  for (const t of tiles()) if (t.kick) { moving = true; t.kick *= .8; if (t.kick < .01) t.kick = 0; }
  if (moving) { lastSig = ""; }
}
addEventListener("keydown", e => {
  if (e.code !== "Space" || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.target.isContentEditable) return;
  e.preventDefault(); kickAll();
});

// move by dragging the tile, resize by dragging the corner; whatever you touch comes to the front
function drag(t, grip) {
  t.addEventListener("pointerdown", e => {
    if (e.target.closest(".tools") || e.target.isContentEditable || e.target.tagName === "TEXTAREA") return;
    e.preventDefault();
    t.style.zIndex = ++zTop;
    t.classList.add("held");
    t.setPointerCapture(e.pointerId);
    const resize = e.target === grip;
    const x0 = e.clientX, y0 = e.clientY, l0 = t.offsetLeft, t0 = t.offsetTop, w0 = t.offsetWidth;
    const move = ev => {
      const dx = ev.clientX - x0, dy = ev.clientY - y0;
      if (resize) t.style.width = vw(Math.max(40, w0 + dx)) + "vw";
      else { t.style.left = vw(l0 + dx) + "vw"; t.style.top = vw(Math.max(0, t0 + dy)) + "vw"; }
    };
    const up = () => { t.classList.remove("held"); t.removeEventListener("pointermove", move); t.removeEventListener("pointerup", up); };
    t.addEventListener("pointermove", move);
    t.addEventListener("pointerup", up);
  });
}

// ---- dropping videos, pictures and text files: they are thrown from where you let go -------------------
function isVideo(f) { return f.type.startsWith("video/") || /\.(mp4|webm|mov|m4v|ogv)$/i.test(f.name); }
function isImage(f) { return f.type.startsWith("image/") || /\.(png|jpe?g|webp|gif|avif|bmp)$/i.test(f.name); }
function isText(f) { return f.type === "text/plain" || /\.(txt|md)$/i.test(f.name); }

async function throwIn(files, cx, cy) {
  files = files.filter(f => isVideo(f) || isImage(f) || isText(f)).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  if (!files.length) return say("no videos, pictures or text in that / ahí no hay videos, fotos ni texto");
  const texts = await Promise.all(files.map(f => isText(f) ? f.text() : null));
  const n = files.length, w = Math.max(9, Math.min(22, 60 / Math.sqrt(n)));   // fewer videos, bigger tiles
  files.forEach((f, i) => {
    const ww = isText(f) ? Math.max(w, 20) : w;
    const x0 = vw(cx) - ww / 2, y0 = vw(cy + window.scrollY) - ww / 2;
    const t = isText(f) ? makeText({ text: texts[i].trim() || f.name, x: x0, y: y0, w: ww })
                        : makeTile({ file: f.name, src: URL.createObjectURL(f), name: f.name.replace(/\.[^.]+$/, ""), x: x0, y: y0, w });
    t.style.setProperty("--spin", (Math.random() * 60 - 30) + "deg");
    t.classList.add("fresh");
    // land on a loose spiral around the drop point, each a little off
    const a = i * 2.4, r = n === 1 ? 0 : w * 0.75 * Math.sqrt(i + 0.6);
    const x = x0 + Math.cos(a) * r + (Math.random() - .5) * w * .3;
    const y = y0 + Math.sin(a) * r * 0.7 + (Math.random() - .5) * w * .3;
    setTimeout(() => {
      t.classList.remove("fresh");
      t.style.left = Math.min(100 - ww, Math.max(0, x)) + "vw";
      t.style.top = Math.max(0, y) + "vw";
    }, 30 + i * 70);
  });
  say(`${files.length} thrown in / lanzados`);
}

async function filesFrom(dt) {
  const items = [...(dt.items || [])].filter(it => it.kind === "file");
  if (items.length && items[0].getAsFileSystemHandle) {          // Chrome/Edge: folders work, and we remember the folder
    const handles = await Promise.all(items.map(it => it.getAsFileSystemHandle()));
    const out = [];
    for (const h of handles) {
      if (!h) continue;
      if (h.kind === "directory") {
        folder = h;
        for await (const entry of h.values()) if (entry.kind === "file") out.push(await entry.getFile());
      } else out.push(await h.getFile());
    }
    return out;
  }
  return [...dt.files];
}

addEventListener("dragover", e => { e.preventDefault(); stage.classList.add("over"); });
addEventListener("dragleave", e => { if (!e.relatedTarget) stage.classList.remove("over"); });
addEventListener("drop", async e => {
  e.preventDefault(); stage.classList.remove("over");
  const { clientX: x, clientY: y } = e;
  const files = await filesFrom(e.dataTransfer);
  if (!files.length) { const s = e.dataTransfer.getData("text"); if (s && s.trim()) return addText(s.trim(), x, y); }
  throwIn(files, x, y);
});
document.getElementById("pick").onchange = e => { throwIn([...e.target.files], innerWidth / 2, innerHeight / 2); e.target.value = ""; };
document.getElementById("addtext").onclick = () => addText("", innerWidth / 2, innerHeight / 3, true);
document.addEventListener("paste", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  const s = e.clipboardData.getData("text");
  if (s && s.trim()) { e.preventDefault(); addText(s.trim(), lastX, lastY); }
});

// ---- sound: browsers need one click before anything may sound -----------------
document.getElementById("sound").onclick = () => {
  soundOn = !soundOn;
  document.getElementById("sound").textContent = soundOn ? "silence / silencio" : "sound / sonido";
  for (const t of tiles()) { const v = t.querySelector("video"); if (!v) continue; v.muted = !(soundOn && t.dataset.sound === "1"); v.play(); }
  if (soundOn && !tiles().some(t => t.dataset.sound === "1")) say("turn on ♪ on the videos you want to hear / activa ♪ en los que quieras oír");
};

// ---- save / guardar: this page again, with the map inside -------------------------------
function layout() {
  const num = (t, k) => +parseFloat(t.style[k]).toFixed(2);
  return tiles().map(t => t.classList.contains("words")
    ? { kind: "text", text: t.dataset.text, x: num(t, "left"), y: num(t, "top"), w: num(t, "width"), z: +t.style.zIndex,
        size: +(+t.dataset.size).toFixed(3), mode: t.dataset.mode }
    : { file: t.dataset.file, name: t.querySelector(".name").textContent, x: num(t, "left"), y: num(t, "top"),
        w: num(t, "width"), z: +t.style.zIndex, sound: t.dataset.sound === "1" })
    .concat([{ kind: "pulse", rhythm: pulseSel.value, bpm: +bpmBox.value }]);
}

document.getElementById("save").onclick = async () => {
  if (!tiles().length) return say("nothing to save yet / nada que guardar todavía");
  const marker = "// @" + "layout";
  const line = "let LAYOUT = " + JSON.stringify(layout()).replace(/</g, "\\u003c") + "; " + marker;
  const html = SOURCE.replace(new RegExp("let LAYOUT = .*; " + marker), () => line);
  try {
    if (folder) {                                                 // the folder that was dropped: write right next to the videos
      const f = await folder.getFileHandle("patamapa.html", { create: true });
      const w = await f.createWritable(); await w.write(html); await w.close();
      return say(`saved / guardado: ${folder.name}\\patamapa.html`);
    }
    if (window.showSaveFilePicker) {
      const f = await showSaveFilePicker({ suggestedName: "patamapa.html", types: [{ description: "map", accept: { "text/html": [".html"] } }] });
      const w = await f.createWritable(); await w.write(html); await w.close();
      return say("saved / guardado. It must sit next to the videos / debe estar junto a los videos");
    }
  } catch (err) { if (err.name === "AbortError") return; }
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([html], { type: "text/html" })), download: "patamapa.html" });
  a.click();
  say("downloaded patamapa.html: move it next to the videos / muévelo junto a los videos");
};

// ---- a saved map: the videos are the files next to this page, the words are inside it ------------------
if (LAYOUT) for (const t of LAYOUT) {
  if (t.kind === "pulse") { pulseSel.value = t.rhythm; bpmBox.value = t.bpm; }
  else if (t.kind === "text") makeText(t);
  else makeTile({ ...t, src: encodeURI(t.file) });
}
refreshHint();
addEventListener("resize", wordsLater);
tick();
setInterval(wordsNow, 300);                                      // also when the tab is in the background
</script>
</body>
</html>
